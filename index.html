<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gatinhos Aleatórios 🐱</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:   #fdf6ee;
      --peach:   #f4c89a;
      --rust:    #c9622f;
      --dark:    #1e1209;
      --mid:     #7a4a2e;
      --shadow:  rgba(30, 18, 9, 0.18);
    }

    body {
      min-height: 100vh;
      background-color: var(--cream);
      background-image:
        radial-gradient(ellipse 80% 60% at 20% 10%, #f9e5cc 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 90%, #f4d4b0 0%, transparent 55%);
      font-family: 'DM Sans', sans-serif;
      color: var(--dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
      animation: fadeDown .7s ease both;
    }

    .eyebrow {
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: .72rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--rust);
      margin-bottom: .5rem;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 6vw, 3.8rem);
      line-height: 1.1;
      color: var(--dark);
    }

    h1 em {
      font-style: italic;
      color: var(--rust);
    }

    .subtitle {
      margin-top: .75rem;
      font-size: .95rem;
      font-weight: 300;
      color: var(--mid);
      letter-spacing: .02em;
    }

    /* ── Card ── */
    .card {
      background: #fff;
      border-radius: 1.5rem;
      box-shadow: 0 8px 40px var(--shadow), 0 2px 8px var(--shadow);
      overflow: hidden;
      width: 100%;
      max-width: 520px;
      animation: fadeUp .7s .15s ease both;
      position: relative;
    }

    /* Decorative corner paw */
    .card::before {
      content: "🐾";
      position: absolute;
      top: 1rem; right: 1.2rem;
      font-size: 1.4rem;
      opacity: .25;
      z-index: 1;
    }

    /* ── Image wrapper ── */
    .img-wrap {
      width: 100%;
      aspect-ratio: 4/3;
      background: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    #cat-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      transition: opacity .45s ease;
    }

    #cat-img.visible { display: block; }

    /* Skeleton loader */
    .skeleton {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #f0e8de 25%, #fdf6ee 50%, #f0e8de 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    .skeleton.hidden { display: none; }

    /* ── Footer area inside card ── */
    .card-footer {
      padding: 1.4rem 1.8rem 1.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    /* ── Button ── */
    button {
      cursor: pointer;
      border: none;
      outline: none;
      font-family: 'DM Sans', sans-serif;
      font-size: .92rem;
      font-weight: 500;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: .85rem 2.4rem;
      border-radius: 99px;
      background: var(--rust);
      color: #fff;
      box-shadow: 0 4px 18px rgba(201,98,47,.35);
      transition: transform .18s, box-shadow .18s, background .18s;
      display: flex;
      align-items: center;
      gap: .55rem;
    }

    button:hover  { background: #b55628; transform: translateY(-2px); box-shadow: 0 6px 24px rgba(201,98,47,.45); }
    button:active { transform: translateY(0); box-shadow: 0 2px 10px rgba(201,98,47,.3); }
    button:disabled { opacity: .55; cursor: not-allowed; transform: none; }

    .btn-icon { font-size: 1.05rem; animation: none; }
    button.loading .btn-icon { animation: spin .7s linear infinite; }

    /* ── Error message ── */
    #error-msg {
      display: none;
      background: #fff0eb;
      border: 1.5px solid #f4c0a0;
      border-radius: .75rem;
      padding: .85rem 1.2rem;
      font-size: .88rem;
      color: var(--rust);
      text-align: center;
      width: 100%;
      line-height: 1.5;
    }
    #error-msg.visible { display: block; }

    /* ── Footer outside card ── */
    footer {
      margin-top: 2rem;
      font-size: .78rem;
      color: var(--mid);
      opacity: .6;
      letter-spacing: .04em;
      animation: fadeUp .7s .3s ease both;
    }

    /* ── Animations ── */
    @keyframes fadeDown  { from { opacity:0; transform:translateY(-18px); } to { opacity:1; transform:none; } }
    @keyframes fadeUp    { from { opacity:0; transform:translateY(18px);  } to { opacity:1; transform:none; } }
    @keyframes shimmer   { to { background-position: -200% 0; } }
    @keyframes spin      { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <p class="eyebrow">Seu dose diária de fofura</p>
    <h1>Gatinhos <em>Aleatórios</em></h1>
    <p class="subtitle">Uma nova imagem de gatinho a cada carregamento 🐱</p>
  </header>

  <div class="card">
    <div class="img-wrap">
      <div class="skeleton" id="skeleton"></div>
      <img id="cat-img" alt="Imagem aleatória de gatinho" />
    </div>
    <div class="card-footer">
      <div id="error-msg" role="alert">
        😿 Ops! Não foi possível obter a imagem do gatinho.<br>Verifique sua conexão e tente novamente.
      </div>
      <button id="reload-btn" onclick="fetchCat()">
        <span class="btn-icon">🔄</span> Novo gatinho
      </button>
    </div>
  </div>

  <footer>Powered by The Cat API &nbsp;·&nbsp; thecatapi.com</footer>

  <script>
    const img       = document.getElementById('cat-img');
    const skeleton  = document.getElementById('skeleton');
    const errorMsg  = document.getElementById('error-msg');
    const btn       = document.getElementById('reload-btn');
    const btnIcon   = btn.querySelector('.btn-icon');

    function setLoading(on) {
      btn.disabled = on;
      if (on) btn.classList.add('loading'); else btn.classList.remove('loading');
      skeleton.classList.toggle('hidden', !on);
      if (on) { img.classList.remove('visible'); errorMsg.classList.remove('visible'); }
    }

    async function fetchCat() {
      setLoading(true);

      try {
        const response = await fetch('https://api.thecatapi.com/v1/images/search');

        if (!response.ok) throw new Error(`HTTP error: ${response.status}`);

        const data = await response.json();
        // data é um array; o link da imagem está em data[0].url
        const imageUrl = data[0].url;

        // Pré-carrega a imagem antes de exibir
        const tempImg = new Image();
        tempImg.onload = () => {
          img.src = imageUrl;
          img.classList.add('visible');
          skeleton.classList.add('hidden');
          setLoading(false);
        };
        tempImg.onerror = showError;
        tempImg.src = imageUrl;

      } catch (err) {
        console.error('Erro ao buscar imagem:', err);
        showError();
      }
    }

    function showError() {
      skeleton.classList.add('hidden');
      errorMsg.classList.add('visible');
      btn.disabled = false;
      btn.classList.remove('loading');
    }

    // Carrega automaticamente ao abrir a página
    fetchCat();
  </script>
</body>
</html>
